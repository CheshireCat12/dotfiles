include theme.conf

font_size 15.0

window_margin_width 0
window_padding_width 5
# single_window_margin_width -1

background_opacity 0.8
# background_blur 64


hide_window_decorations yes
# confirm_os_window_close 0

# Zoom in (e.g., Ctrl + shift + 1)
map kitty_mod+1 change_font_size all +1.0

# Zoom out (e.g., Ctrl + shift + -)

# Open new tab
map ctrl+t new_tab

# Open new tab with corresponding path
map kitty_mod+t new_tab_with_cwd

# moves the window into a new OS window
map kitty_mod+d detach_window

# moves the tab into a new OS window
map kitty_mod+d detach_tab

# move to next tab
map ctrl+shift+l next_tab

# move to next tab
map ctrl+shift+h previous_tab

# explicit setting to allow Ctrl+Shift combinations
map ctrl+shift+7 send_text all _

shell_integration disabled

tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}


# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
